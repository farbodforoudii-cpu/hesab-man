name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of every app module
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Money, dates and market maths
        run: TZ=Asia/Tehran node --test tests/*.test.mjs
