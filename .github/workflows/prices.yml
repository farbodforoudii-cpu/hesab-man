name: prices
on:
  schedule:
    - cron: '17 8-15 * * *'      # hourly while Tehran trades, 11:47–18:47 Tehran
    - cron: '17 3,5,17,19 * * *' # outside market hours: 06:47, 08:47, 20:47, 22:47 Tehran
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/prices.py
      - name: Check the live price relay used by the app's refresh button
        run: curl -s -m 30 https://paclucymaqgellnlctbv.supabase.co/functions/v1/prices || true
      - run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Prices $(date -u +%F\ %H:%M)"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
